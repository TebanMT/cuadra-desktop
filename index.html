<!doctype html>
<html lang="es-MX">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#183e55" />
  <link rel="icon" type="image/svg+xml" href="/brand/tinta-app-icon.svg" />
  <link rel="stylesheet" href="/brand/tokens.css" />
  <title>Tinta — software de recepción para gimnasios</title>
  <script>
    (function () {
      try {
        var k = "tinta:theme";
        var pref = localStorage.getItem(k);
        var dark =
          pref === "dark" ||
          (pref !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (_) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
