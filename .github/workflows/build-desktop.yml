# Build Tinta Desktop para macOS (arm64 + x86_64) y Windows (x86_64).
#
# La app Tauri necesita el sidecar Go (tinta-core/cmd/sidecar) bundleado
# como binary externo. El sidecar usa CGO (mattn/go-sqlite3) así que cada
# plataforma se cross-compila en su runner nativo (no desde Mac).
#
# Triggers:
#   - push de tag `desktop-v*` → release artifacts
#   - workflow_dispatch → builds ad-hoc para testing
#
# Artefactos producidos:
#   macOS arm64  → Tinta.app + Tinta_x.y.z_aarch64.dmg
#   macOS x86_64 → Tinta.app + Tinta_x.y.z_x64.dmg
#   Windows      → Tinta_x.y.z_x64-setup.exe + Tinta_x.y.z_x64_en-US.msi
#
# Para release firmado en macOS necesitas (futuro):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
# Para Windows firmado:
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
# Mientras esos secrets no existan, los .app/.exe salen sin firma → el
# usuario verá "autor desconocido" al abrir. Funcional pero con friction.

name: Build desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (defaults to tauri.conf.json)"
        required: false

# Si la repo está organizada como monorepo con tinta-core en otro repo,
# hay que clonar ambos. Asumimos que tinta-desktop tiene los repos como
# submodules o que el workflow clona tinta-core por separado. Con
# repos independientes (caso actual), checkout tinta-core via clone.

env:
  TINTA_CORE_REPO: TebanMT/cuadra-core
  TINTA_CORE_REF: main
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: "stable"

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # macOS — un solo job que produce arm64 + x86_64 separados
  # ─────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS ${{ matrix.target.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { arch: arm64,  rust: aarch64-apple-darwin, go: arm64 }
          - { arch: x86_64, rust: x86_64-apple-darwin,  go: amd64 }
    steps:
      - name: Checkout tinta-desktop
        uses: actions/checkout@v4

      - name: Checkout tinta-core (sidecar source)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TINTA_CORE_REPO }}
          ref: ${{ env.TINTA_CORE_REF }}
          path: tinta-core
          # Si tinta-core es repo privado, agregar token:
          # token: ${{ secrets.TINTA_CORE_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tinta-core/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        # No pasamos `version:` — action-setup lo lee de `packageManager`
        # en package.json (pnpm@9.0.0). Pasar ambos rompe con
        # ERR_PNPM_BAD_PM_VERSION en v4 / "multiple versions specified".
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target.rust }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target.rust }}

      - name: Build Go sidecar (${{ matrix.target.arch }})
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.target.go }}
        run: |
          mkdir -p src-tauri/binaries
          cd tinta-core
          export SDKROOT=$(xcrun -sdk macosx --show-sdk-path)
          go build -tags sidecar \
            -o ../src-tauri/binaries/tinta-sidecar-${{ matrix.target.rust }} \
            ./cmd/sidecar
          file ../src-tauri/binaries/tinta-sidecar-${{ matrix.target.rust }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        run: pnpm tauri build --target ${{ matrix.target.rust }}

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: tinta-desktop-macos-${{ matrix.target.arch }}-app
          path: src-tauri/target/${{ matrix.target.rust }}/release/bundle/macos/Tinta.app
          if-no-files-found: error

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: tinta-desktop-macos-${{ matrix.target.arch }}-dmg
          path: src-tauri/target/${{ matrix.target.rust }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────
  # Windows x86_64
  # ─────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout tinta-desktop
        uses: actions/checkout@v4

      - name: Checkout tinta-core
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TINTA_CORE_REPO }}
          ref: ${{ env.TINTA_CORE_REF }}
          path: tinta-core
          # token: ${{ secrets.TINTA_CORE_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tinta-core/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        # No pasamos `version:` — action-setup lo lee de `packageManager`
        # en package.json (pnpm@9.0.0). Pasar ambos rompe con
        # ERR_PNPM_BAD_PM_VERSION en v4 / "multiple versions specified".
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc

      - name: Build Go sidecar (windows x86_64)
        # windows-latest viene con MinGW/MSYS preinstalado y Go usa el
        # toolchain por defecto cuando CGO_ENABLED=1 + GOOS=windows.
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cd tinta-core
          go build -tags sidecar \
            -o ../src-tauri/binaries/tinta-sidecar-x86_64-pc-windows-msvc.exe \
            ./cmd/sidecar
          ls -la ../src-tauri/binaries/

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows installer (NSIS .exe)
        uses: actions/upload-artifact@v4
        with:
          name: tinta-desktop-windows-setup
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload Windows installer (MSI)
        uses: actions/upload-artifact@v4
        with:
          name: tinta-desktop-windows-msi
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────
  # Publish to R2 — solo en push de tag `desktop-v*`, no en workflow_dispatch.
  # Sube los installers a dl.entinta.app con paths predecibles para que
  # el dashboard pueda linkearlos directamente sin URL signing.
  #
  # Required GitHub secrets:
  #   R2_ACCESS_KEY_ID       Access Key del API token R2 con permisos write
  #   R2_SECRET_ACCESS_KEY   Secret correspondiente
  #   R2_ENDPOINT            https://<account-id>.r2.cloudflarestorage.com
  #   R2_BUCKET              tinta-installers (o el nombre que elegiste)
  #
  # Estructura final en R2:
  #   tinta-installers/desktop/<version>/Tinta-arm64.dmg
  #   tinta-installers/desktop/<version>/Tinta-x64.dmg
  #   tinta-installers/desktop/<version>/Tinta-Setup.exe
  #   tinta-installers/desktop/<version>/Tinta.msi
  #   tinta-installers/desktop/latest/...   ← copia, link estable para CTAs
  # ─────────────────────────────────────────────────────────────────────
  publish-to-r2:
    name: Publish installers to R2
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          # tag "desktop-v0.6.1" → version "0.6.1"
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show what we got
        run: |
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -exec ls -lh {} +

      - name: Configure AWS CLI for R2
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<EOF
          [r2]
          aws_access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          EOF
          chmod 600 ~/.aws/credentials

      - name: Upload to R2 (versioned path + latest alias)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # Helper para subir + setear content-type apropiado
          # cache-control corto en /latest/ (5 min) para que cuando
          # publiques nueva versión los users la agarren rápido.
          # Largo en /vX/ (1 año, immutable) porque esos paths nunca cambian.
          upload() {
            local file="$1"
            local key="$2"
            local cache="$3"
            local content_type="$4"

            echo "→ s3://${R2_BUCKET}/${key}"
            aws s3 cp "${file}" "s3://${R2_BUCKET}/${key}" \
              --endpoint-url "${R2_ENDPOINT}" \
              --profile r2 \
              --cache-control "${cache}" \
              --content-type "${content_type}" \
              --only-show-errors
          }

          # Mapeo: archivo encontrado → key destino
          # macOS arm64
          DMG_ARM64=$(find artifacts -name '*aarch64*.dmg' -o -name '*arm64*.dmg' 2>/dev/null | head -1)
          if [ -n "$DMG_ARM64" ]; then
            upload "$DMG_ARM64" "desktop/v${VERSION}/Tinta-arm64.dmg" "public, max-age=31536000, immutable" "application/x-apple-diskimage"
            upload "$DMG_ARM64" "desktop/latest/Tinta-arm64.dmg" "public, max-age=300" "application/x-apple-diskimage"
          fi

          # macOS x86_64
          DMG_X64=$(find artifacts -name '*x86_64*.dmg' -o -name '*x64*.dmg' 2>/dev/null | head -1)
          if [ -n "$DMG_X64" ]; then
            upload "$DMG_X64" "desktop/v${VERSION}/Tinta-x64.dmg" "public, max-age=31536000, immutable" "application/x-apple-diskimage"
            upload "$DMG_X64" "desktop/latest/Tinta-x64.dmg" "public, max-age=300" "application/x-apple-diskimage"
          fi

          # Windows NSIS .exe (instalador estándar)
          EXE=$(find artifacts -name '*setup*.exe' -o -name '*Setup*.exe' 2>/dev/null | head -1)
          if [ -n "$EXE" ]; then
            upload "$EXE" "desktop/v${VERSION}/Tinta-Setup.exe" "public, max-age=31536000, immutable" "application/octet-stream"
            upload "$EXE" "desktop/latest/Tinta-Setup.exe" "public, max-age=300" "application/octet-stream"
          fi

          # Windows MSI (alternativa, GPO friendly)
          MSI=$(find artifacts -name '*.msi' 2>/dev/null | head -1)
          if [ -n "$MSI" ]; then
            upload "$MSI" "desktop/v${VERSION}/Tinta.msi" "public, max-age=31536000, immutable" "application/x-msi"
            upload "$MSI" "desktop/latest/Tinta.msi" "public, max-age=300" "application/x-msi"
          fi

          echo ""
          echo "✓ Published v${VERSION}"
          echo "  Direct links:"
          echo "    https://dl.entinta.app/desktop/latest/Tinta-arm64.dmg"
          echo "    https://dl.entinta.app/desktop/latest/Tinta-x64.dmg"
          echo "    https://dl.entinta.app/desktop/latest/Tinta-Setup.exe"
          echo "    https://dl.entinta.app/desktop/latest/Tinta.msi"
