# ⚠️ DEPRECADO — reemplazado por release.yml (tag `v*.*.*`).
#
# El flujo de release se consolidó en UN solo workflow (release.yml) que
# buildea Windows una vez, sube a R2 (dl.entinta.app) Y registra el manifest
# del auto-updater. El tag `desktop-v*` ya NO se usa: el R2 publish ahora vive
# en release.yml (disparado por `v*`). Este archivo quedó SOLO-dispatch como
# builder multi-plataforma manual de respaldo durante la transición. Borralo
# tras verificar el flujo consolidado con un release `v*` exitoso.
#
# Build Tinta Desktop para macOS (arm64 + x86_64) y Windows (x86_64).
#
# La app Tauri necesita el sidecar Go (tinta-core/cmd/sidecar) bundleado
# como binary externo. El sidecar usa CGO (mattn/go-sqlite3) así que cada
# plataforma se cross-compila en su runner nativo (no desde Mac).
#
# Trigger:
#   - workflow_dispatch → builds ad-hoc (NO publica a R2 — eso es release.yml).
#
# Artefactos producidos (configurado en tauri.conf.json bundle.targets):
#   macOS arm64  → Tinta_x.y.z_aarch64.dmg     (DMG contiene Tinta.app adentro)
#   macOS x86_64 → Tinta_x.y.z_x64.dmg         (idem)
#   Windows      → Tinta_x.y.z_x64-setup.exe   (NSIS installer)
#                  Tinta_x.y.z_x64_en-US.msi   (MSI alternativo, GPO-friendly)
#
# El usuario abre el DMG, arrastra Tinta.app a /Applications, y listo.
# Si querés también un .app standalone, agregá 'app' a bundle.targets en
# tauri.conf.json y volvé a habilitar el step de Upload .app del macOS job.
#
# Para release firmado en macOS necesitas (futuro):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
# Para Windows firmado:
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
# Mientras esos secrets no existan, los .app/.exe salen sin firma → el
# usuario verá "autor desconocido" al abrir. Funcional pero con friction.

name: Build desktop (DEPRECADO)

on:
  # DEPRECADO: el trigger por tag `desktop-v*` se eliminó. El release real
  # (build + R2 + manifest) vive en release.yml (tag `v*`). Esto queda
  # dispatch-only como builder manual de respaldo.
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (defaults to tauri.conf.json)"
        required: false
      core_ref:
        description: "Ref de cuadra-core a bundlear (tag/branch/SHA). Vacío usa TINTA_CORE_REF."
        required: false

# Si la repo está organizada como monorepo con tinta-core en otro repo,
# hay que clonar ambos. Asumimos que tinta-desktop tiene los repos como
# submodules o que el workflow clona tinta-core por separado. Con
# repos independientes (caso actual), checkout tinta-core via clone.

env:
  TINTA_CORE_REPO: TebanMT/cuadra-core
  # Ref de cuadra-core (sidecar) por DEFAULT. Para un build reproducible fija
  # acá un tag de core (ej. v1.0.0) antes de taggear, o pásalo en el input
  # core_ref. "main" = último commit (no reproducible). El SHA bundleado queda
  # en el log del step "Checkout tinta-core".
  TINTA_CORE_REF: v1.0.13
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: "stable"
  # Release tag de cuadra-core con los binarios NBIS Windows (mindtct.exe +
  # bozorth3.exe) que el sidecar invoca como subprocess. Se publica desde
  # cuadra-core/.github/workflows/build-nbis-windows.yml. Bumpear acá sólo
  # cuando se publique un release nuevo — los binarios cambian rara vez.
  NBIS_VERSION: nbis-v1

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # macOS — un solo job que produce arm64 + x86_64 separados
  # ─────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS ${{ matrix.target.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { arch: arm64,  rust: aarch64-apple-darwin, go: arm64 }
          - { arch: x86_64, rust: x86_64-apple-darwin,  go: amd64 }
    steps:
      - name: Checkout tinta-desktop
        uses: actions/checkout@v4

      - name: Checkout tinta-core (sidecar source)
        # cuadra-core es repo privado, así que el GITHUB_TOKEN del runner
        # (que solo tiene acceso al repo del workflow) no puede leerlo.
        # Usamos un PAT fine-grained con scope `Contents: Read-only` sobre
        # cuadra-core, guardado en el secret TINTA_CORE_TOKEN.
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TINTA_CORE_REPO }}
          ref: ${{ inputs.core_ref || env.TINTA_CORE_REF }}
          path: tinta-core
          token: ${{ secrets.TINTA_CORE_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tinta-core/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        # No pasamos `version:` — action-setup lo lee de `packageManager`
        # en package.json (pnpm@9.0.0). Pasar ambos rompe con
        # ERR_PNPM_BAD_PM_VERSION en v4 / "multiple versions specified".
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target.rust }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target.rust }}

      - name: Build Go sidecar (${{ matrix.target.arch }})
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.target.go }}
        run: |
          # Output al raíz de src-tauri/ (sin subcarpeta binaries/) porque
          # Tauri aplana paths al bundlear macOS — ver comentario en
          # src-tauri/src/sidecar.rs sobre el mismatch que causaba ENOENT.
          cd tinta-core
          export SDKROOT=$(xcrun -sdk macosx --show-sdk-path)
          go build -tags sidecar \
            -o ../src-tauri/tinta-sidecar-${{ matrix.target.rust }} \
            ./cmd/sidecar
          file ../src-tauri/tinta-sidecar-${{ matrix.target.rust }}

          # Ad-hoc signing del sidecar. Apple Silicon (M1+) exige que todo
          # binario tenga al menos firma ad-hoc para ejecutarse — sin
          # esto el spawn falla con ENOENT aunque el archivo exista.
          # Tauri firma su binario principal automáticamente; el sidecar
          # external NO, así que lo hacemos acá.
          # Una vez tengamos Developer ID + notarization (APPLE_CERTIFICATE
          # en secrets), reemplazar `-` por la identidad real.
          codesign --force --sign - --options runtime \
            ../src-tauri/tinta-sidecar-${{ matrix.target.rust }}
          codesign -dv ../src-tauri/tinta-sidecar-${{ matrix.target.rust }} 2>&1 | head -3

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        # Tauri 2 hace `codesign --deep` automáticamente del bundle entero
        # (incluyendo external bins como nuestro sidecar Go) si
        # `bundle.macOS.signingIdentity` está seteado en tauri.conf.json.
        # Lo seteamos a "-" (ad-hoc) ahí para que cada DMG salga con
        # bundle firmado de forma que pueda ejecutarse en Apple Silicon.
        run: pnpm tauri build --target ${{ matrix.target.rust }}

      # Verificar que la firma quedó OK (defensa contra cambios en
      # tauri.conf.json que rompan el signing)
      - name: Verify bundle signature
        run: |
          BUNDLE="src-tauri/target/${{ matrix.target.rust }}/release/bundle/macos/Tinta.app"
          codesign --verify --deep --strict "$BUNDLE" && echo "✓ bundle firmado correctamente"
          codesign -dv "$BUNDLE" 2>&1 | head -5
          # El sidecar específicamente — es lo que Apple Silicon más exige
          codesign -dv "$BUNDLE/Contents/MacOS/tinta-sidecar" 2>&1 | head -5

      # Debug: lista lo que Tauri produjo, útil cuando algún bundle target
      # falla silenciosamente o se genera con nombre distinto al esperado.
      - name: List bundle output
        run: |
          echo "Contents of bundle/:"
          ls -la src-tauri/target/${{ matrix.target.rust }}/release/bundle/ || true
          echo
          echo "All files in bundle/ (recursive):"
          find src-tauri/target/${{ matrix.target.rust }}/release/bundle/ -type f 2>/dev/null || true

      - name: Upload .dmg
        # bundle.targets en tauri.conf.json es ['msi', 'dmg'] — Tauri NO
        # genera un .app standalone, solo lo empaqueta dentro del DMG.
        # El DMG es lo que el user descarga y arrastra a /Applications.
        # Si en algún momento querés el .app aparte (raro), agregá 'app'
        # a bundle.targets y volvés a poner el upload acá.
        uses: actions/upload-artifact@v4
        with:
          name: tinta-desktop-macos-${{ matrix.target.arch }}-dmg
          path: src-tauri/target/${{ matrix.target.rust }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────
  # Windows x86_64
  # ─────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout tinta-desktop
        uses: actions/checkout@v4

      - name: Checkout tinta-core
        # PAT con scope `Contents: Read-only` sobre cuadra-core
        # (mismo patrón que el job de macOS arriba).
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TINTA_CORE_REPO }}
          ref: ${{ inputs.core_ref || env.TINTA_CORE_REF }}
          path: tinta-core
          token: ${{ secrets.TINTA_CORE_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tinta-core/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        # No pasamos `version:` — action-setup lo lee de `packageManager`
        # en package.json (pnpm@9.0.0). Pasar ambos rompe con
        # ERR_PNPM_BAD_PM_VERSION en v4 / "multiple versions specified".
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc

      - name: Build Go sidecar (windows x86_64)
        # windows-latest viene con MinGW/MSYS preinstalado y Go usa el
        # toolchain por defecto cuando CGO_ENABLED=1 + GOOS=windows.
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
        shell: bash
        run: |
          # Sin subcarpeta binaries/ — match con tauri.conf.json
          # externalBin = ["tinta-sidecar"] para evitar el mismatch
          # de paths que rompía el spawn en macOS (ver sidecar.rs).
          cd tinta-core
          go build -tags sidecar \
            -o ../src-tauri/tinta-sidecar-x86_64-pc-windows-msvc.exe \
            ./cmd/sidecar
          ls -la ../src-tauri/tinta-sidecar-*.exe

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Download NBIS binaries (mindtct.exe + bozorth3.exe)
        # Los baja del release `${NBIS_VERSION}` de este mismo repo a
        # src-tauri/binaries/nbis/ con el sufijo del target triple que
        # externalBin exige (mindtct-x86_64-pc-windows-msvc.exe). Tauri los
        # bundlea via externalBin al lado del .exe principal, donde el
        # sidecar los resuelve via filepath.Dir(os.Executable()).
        # GITHUB_TOKEN (auto-inyectado por Actions) alcanza porque el
        # release vive en el mismo repo — sin necesidad de PAT extra.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NBIS_VERSION: ${{ env.NBIS_VERSION }}
        shell: bash
        run: bash scripts/prepare-nbis-windows.sh

      - name: Build Tauri
        # `--config src-tauri/tauri.windows.conf.json` merge un overlay
        # Windows-only sobre el config base — extiende `bundle.externalBin`
        # con los binarios NBIS sin contaminar el bundle macOS (que no tiene
        # ni necesita esos .exe). El merge de Tauri 2 (JSON Merge Patch)
        # reemplaza arrays enteros, por eso el overlay re-lista tinta-sidecar.
        run: pnpm tauri build --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json

      - name: Upload Windows installer (NSIS .exe)
        uses: actions/upload-artifact@v4
        with:
          name: tinta-desktop-windows-setup
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload Windows installer (MSI)
        uses: actions/upload-artifact@v4
        with:
          name: tinta-desktop-windows-msi
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

