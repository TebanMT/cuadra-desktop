# Compila los binarios NBIS (mindtct + bozorth3) para Windows x86_64 y los
# publica como release artifacts de este mismo repo (cuadra-desktop). El
# sidecar Go del desktop los invoca como subprocess (ADR-004-bis): mindtct
# extrae la plantilla ANSI/ISO 19794-2 del PNG capturado en el frontend,
# bozorth3 hace 1:N contra la galería.
#
# Por qué vive acá (no en cuadra-core):
#   - El único consumidor de estos .exe es el bundle Windows del desktop.
#     El sidecar Go que los llama vive en cuadra-core, pero el build cloud
#     no los necesita (sólo se usan bajo `//go:build sidecar`).
#   - cuadra-desktop ya tiene el pipeline de Windows + el bundle Tauri; el
#     workflow del bundle (build-desktop.yml job Windows) consume estos
#     assets vía scripts/prepare-nbis-windows.sh. Mantenerlos en el mismo
#     repo evita cross-repo PATs y permisos.
#
# Por qué un workflow aparte:
#   - El build Windows con MSYS2/MinGW es lento (~6-10 min) y los binarios
#     cambian rara vez (sólo cuando bumpeamos NBIS o tocamos los flags).
#     Correrlo en cada push de cuadra-desktop es desperdicio.
#   - El runner Windows es ~2x más caro que Linux. Tag-only minimiza gasto.
#   - Reproducible: los binarios resultantes son public-domain (NIST), así
#     que se pueden publicar como release assets sin licencia.
#
# Trigger:
#   - push de tag `nbis-v*` → build + release con los .exe como assets.
#   - workflow_dispatch → builds ad-hoc para validar cambios de flags antes
#     de tagear (no crea release, sube como workflow artifact).
#
# Fuente NBIS:
#   El mirror oficial https://github.com/lessandro/nbis es un git import de
#   la última release pública de NIST (5.0.0, 2015). Lo clonamos en cada
#   run en lugar de vendorear el tarball — el repo es chico (~10MB) y así
#   evitamos checkear-in C que jamás vamos a tocar nosotros.
#
# Flags de build (validados manualmente 2026-05-16, ver memoria
# project_biometric_strategy.md):
#
#     ./setup.sh "$INSTALL_DIR" --MSYS --STDLIBS --64
#
#   --MSYS activa el path rules_msys.mak.src (sed-pipeline + paths MSYS) y
#   apaga X11. **Pero NO implica --STDLIBS** a pesar de que setea el flag
#   STDLIBS_FLAG=1 (es un bug del setup.sh): para apagar libpng + openjp2
#   hay que pasar --STDLIBS explícito, que es lo que apaga
#   NBIS_PNG_FLAG/NBIS_OPENJP2_FLAG. Sin esto el build intenta compilar
#   libpng-1.2.23 (que no tiene `configure` moderno) y openjp2 (que pide
#   CMake < 3.5, removido en CMake 3.x).
#   --64 fuerza -m64. El bundle final sólo necesita el matcher JPEG-based
#   (el sidecar Go re-encodea el PNG entrante como JPEG antes de mindtct).
#
# Output:
#   Cada release tag `nbis-vX.Y` queda con dos assets en
#   https://github.com/TebanMT/cuadra-desktop/releases/tag/nbis-vX.Y :
#     - mindtct.exe
#     - bozorth3.exe
#     - BUILD_INFO.txt (provenance: sha del source, flags, fecha)
#   El job Windows de build-desktop.yml los descarga via
#   scripts/prepare-nbis-windows.sh.

name: Build NBIS Windows binaries

on:
  push:
    tags: ["nbis-v*"]
  workflow_dispatch:
    inputs:
      nbis_ref:
        description: "lessandro/nbis git ref to build (default: master)"
        required: false
        default: master

permissions:
  contents: write # necesario para crear el release en el step final

env:
  NBIS_REPO: https://github.com/lessandro/nbis.git
  NBIS_REF: ${{ inputs.nbis_ref || 'master' }}

jobs:
  build:
    name: Build mindtct.exe + bozorth3.exe
    runs-on: windows-latest
    defaults:
      run:
        # Todo el flow corre dentro del shell MSYS2 — el script setup.sh
        # detecta el entorno por `uname` y rules_msys.mak.src espera /usr/bin.
        # Usar bash de Git for Windows acá rompe el sed-pipeline interno
        # del setup.
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2 + MinGW (64-bit)
        # `msystem: MINGW64` apunta a la toolchain x86_64-w64-mingw32. NBIS
        # compila con gcc estándar, sin dependencias exóticas — sólo make,
        # gcc, sed, cp. CMake aparece mencionado en INSTALL_WINDOWS.txt
        # pero el path moderno con setup.sh + make NO lo requiere; lo
        # incluimos defensivamente por si algún sub-Makefile lo invoca.
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            git

      - name: Clone NBIS source
        # El repo `lessandro/nbis` es público y chico — clone shallow para
        # cortar tiempo de checkout. No usamos actions/checkout porque
        # estamos en msys2 shell y queremos control del path absoluto.
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${NBIS_REF}" "${NBIS_REPO}" nbis
          cd nbis
          echo "NBIS_DIR=$(pwd -W)" >> "$GITHUB_ENV"

      - name: Patch openjp2 cmake minimum (defensive)
        # NBIS 5.0 (2014) usa cmake_minimum_required(VERSION 2.6) en openjp2,
        # removido en CMake ≥3.5. Aunque `--STDLIBS` debería sacar openjp2 de
        # PACKAGES, ya nos pegó una vez en CI, así que parcheamos por las
        # dudas — si el package está filtrado el sed corre y el resultado no
        # se usa; si por algún motivo no está filtrado, evitamos el error.
        # Mismo tratamiento al png (libpng-1.2.23 no tiene `configure`
        # moderno) — saltar el build vía Makefile no-op.
        working-directory: nbis
        run: |
          set -euo pipefail
          find openjp2 -name CMakeLists.txt -print0 \
            | xargs -0 -I{} sed -i 's/^cmake_minimum_required.*$/cmake_minimum_required(VERSION 3.5)/' {} || true

      - name: Configure NBIS (setup.sh --MSYS --STDLIBS --64)
        # `--MSYS` activa el path rules_msys.mak.src + apaga X11. `--STDLIBS`
        # apaga libpng + openjp2 (sino el build intenta compilar libpng-1.2.23
        # sin `configure` moderno, y openjp2 con CMake < 3.5 removido). `--64`
        # fuerza -m64. El install dir tiene que ser absoluto y en formato
        # `C:/...` (con forward slashes) según INSTALL_WINDOWS.txt; pwd -W
        # ya lo entrega así en MSYS2.
        #
        # setup.sh no lee stdin (sólo procesa args + corre gcc/sed). Redirigimos
        # de /dev/null para hacer explícito que no hay prompt — un `yes |`
        # defensivo recibiría SIGPIPE y bajo pipefail mataría el step.
        working-directory: nbis
        run: |
          set -euo pipefail
          INSTALL_DIR="$(pwd -W)/install"
          mkdir -p "$INSTALL_DIR"
          ./setup.sh "$INSTALL_DIR" --MSYS --STDLIBS --64 < /dev/null
          echo "INSTALL_DIR=$INSTALL_DIR" >> "$GITHUB_ENV"

          # Diagnóstico: PACKAGES + CFLAGS que setup.sh dejó en rules.mak.
          echo "--- rules.mak PACKAGES line ---"
          grep "^PACKAGES" rules.mak || echo "(no PACKAGES line found in rules.mak)"

          # NBIS 5.0 fue escrito para GCC ≤9 donde -fcommon era default;
          # MinGW gcc 10+ default-ea -fno-common y rompe el link con
          # "multiple definition of histo_head" / similares (an2k tiene
          # varios globals sin extern en headers). Inyectamos -fcommon
          # en la línea CFLAGS de rules.mak para mantener el comportamiento
          # viejo. p_rules.mak per-package importa CFLAGS de rules.mak, así
          # que con tocar el archivo raíz alcanza.
          sed -i 's|^CFLAGS[[:space:]]*:=|CFLAGS := -fcommon|' rules.mak
          echo "--- rules.mak CFLAGS line ---"
          grep "^CFLAGS" rules.mak || echo "(no CFLAGS line)"

      - name: Build NBIS (make config && make it)
        # `make it` es el target compuesto de NBIS (build + libs + bins).
        # Es serial en muchos sub-Makefiles — -j6 puede romper dependencias
        # internas, así que dejamos make sin paralelizar para reproducibilidad.
        working-directory: nbis
        run: |
          set -euo pipefail
          make config
          make it

      - name: Verify binaries exist
        # Defensa contra "make it" silenciosamente saltando un sub-build.
        # Los dos binarios viven en <module>/bin/ después de `make it`.
        # `make install` los movería al INSTALL_DIR pero no lo necesitamos
        # para empaquetarlos — los tomamos directo de la build tree.
        working-directory: nbis
        run: |
          set -euo pipefail
          ls -la mindtct/bin/mindtct.exe bozorth3/bin/bozorth3.exe
          file mindtct/bin/mindtct.exe bozorth3/bin/bozorth3.exe

      - name: Stage release artifacts
        # Strip los binarios para bajar peso (~40% menos). Stripping NBIS
        # nunca rompió nada en pruebas — son ejecutables straight C, sin
        # exception tables que dependan de símbolos.
        working-directory: nbis
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          cp mindtct/bin/mindtct.exe ../artifacts/mindtct.exe
          cp bozorth3/bin/bozorth3.exe ../artifacts/bozorth3.exe
          strip ../artifacts/mindtct.exe ../artifacts/bozorth3.exe
          ls -lh ../artifacts/

      - name: Capture build metadata
        # Guardamos un .txt al lado de los binarios con el SHA del source y
        # los flags usados. Útil para auditar qué versión exacta del NBIS
        # está empaquetada en un installer publicado hace 6 meses.
        working-directory: nbis
        run: |
          set -euo pipefail
          NBIS_SHA=$(git rev-parse HEAD)
          {
            echo "nbis_source_repo=${NBIS_REPO}"
            echo "nbis_source_ref=${NBIS_REF}"
            echo "nbis_source_sha=${NBIS_SHA}"
            echo "build_flags=--MSYS --64 (implica --STDLIBS --without-X11)"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "github_ref=${GITHUB_REF:-}"
            echo "github_sha=${GITHUB_SHA:-}"
          } > ../artifacts/BUILD_INFO.txt
          cat ../artifacts/BUILD_INFO.txt

      - name: Upload artifacts (workflow_dispatch)
        # En runs ad-hoc dejamos los binarios sólo como workflow artifact
        # para que se puedan descargar manualmente desde la UI de Actions
        # antes de comprometer un release.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nbis-windows-x86_64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Create release with binaries
        # En push de tag `nbis-vX.Y` creamos un release de GitHub con los
        # dos .exe + BUILD_INFO.txt. softprops/action-gh-release respeta el
        # tag actual (no crea uno nuevo) y sube los archivos como assets.
        if: startsWith(github.ref, 'refs/tags/nbis-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mindtct.exe
            artifacts/bozorth3.exe
            artifacts/BUILD_INFO.txt
          # `name` y `body` deliberadamente cortos — el README del repo
          # tiene el contexto completo del por qué publicamos estos binarios.
          name: NBIS Windows binaries (${{ github.ref_name }})
          body: |
            Public-domain NBIS matchers (mindtct + bozorth3) compilados para
            Windows x86_64 con MSYS2/MinGW. Consumidos por el sidecar Go del
            desktop (ADR-004-bis) — no hay licencia ni runtime distinto.

            Build flags: `./setup.sh --MSYS --64` (implica `--STDLIBS
            --without-X11`).

            Para detalles de provenance ver `BUILD_INFO.txt` adjunto.
          draft: false
          prerelease: false
